<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digimons - Digidex</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

    <header>

        <nav>

            <a href="inicio.html">
                Início
            </a>

            <a href="digimons.html">
                Digimons
            </a>

            <a href="favoritos.html">
                Favoritos
            </a>

            <a href="explorar.html">
                Explorar
            </a>

            <a href="estatistica.html">
                Estatística
            </a>

            <a href="configuracoes.html">
                Configurações
            </a>

        </nav>

    </header>


    <main>

        <h1>Digidex</h1>

        <form id="form-nome">

            <input
                id="busca-nome"
                type="search"
                placeholder="Pesquisar por nome..."
                aria-label="Pesquisar Digimon por nome"
                autocomplete="off"
            >

            <button type="submit">
                Pesquisar por nome
            </button>

        </form>


        <form id="form-id">

            <input
                id="busca-id"
                type="text"
                inputmode="numeric"
                placeholder="Pesquisar por ID..."
                aria-label="Pesquisar Digimon por ID"
                autocomplete="off"
            >

            <button type="submit">
                Pesquisar por ID
            </button>

        </form>


        <h2>Resultado da pesquisa</h2>

        <p id="mensagem" role="status" aria-live="polite">
            Pesquise um Digimon pelo nome ou pelo ID.
        </p>


        <div class="digimons">


            <div
                class="digimon"
                id="cartao"
                hidden
            >

                <div class="imagem" id="cartao-imagem">
                    Imagem
                </div>

                <h2 id="cartao-nome"></h2>

                <p id="cartao-id"></p>

                <p id="cartao-nivel"></p>

                <p id="cartao-tipo"></p>

                <p id="cartao-atributo"></p>

                <button
                    id="cartao-favorito"
                    type="button"
                >
                    Favoritar
                </button>

            </div>


        </div>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
